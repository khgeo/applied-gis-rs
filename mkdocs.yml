site_name: GIS និងការយកព័ត៌មានពីចម្ងាយអនុវត្តន៍
site_description: សៀវភៅសិក្សា GIS និងការយកព័ត៌មានពីចម្ងាយអនុវត្តន៍ (Google Earth Engine) ជាភាសាខ្មែរ សម្រាប់វគ្គសិក្សា ១ ឆមាស
site_author: YAM Sarath (យាំ សារដ្ឋ)
site_url: https://khgeo.github.io/applied-gis-rs/
repo_url: https://github.com/khgeo/applied-gis-rs
repo_name: applied-gis-rs
edit_uri: edit/main/docs/
copyright: CC BY-SA 4.0 · អាចប្រើ និងកែសម្រួលបាន ដោយដកស្រង់ប្រភព

theme:
  name: material
  language: en          # Material has no Khmer UI pack; content is Khmer
  font: false           # disable Google Fonts CDN; we load Khmer fonts in CSS
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: orange
      toggle:
        icon: material/weather-night
        name: ប្ដូរទៅរបៀបងងឹត
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: ប្ដូរទៅរបៀបភ្លឺ

extra_css:
  - https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Siemreap&family=Moul&display=swap
  - assets/css/khmer.css
  - https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css
  - assets/css/workbook.css
  - assets/css/lesson-sims.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js
  - assets/js/ag-sims.js
  - assets/js/lesson-sims.js
  - assets/js/workbook.js

markdown_extensions:
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [docs]
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: "¶"
      toc_depth: 3

plugins:
  - search

extra:
  homepage: https://khgeo.github.io/
  social:
    - icon: material/bookshelf
      link: https://khgeo.github.io/
      name: ស៊េរីសៀវភៅទាំង ៤


nav:
  - ទំព័រដើម: index.md
  - កម្មវិធីសិក្សា: syllabus.md
  - ជំពូកទី១៖ មូលដ្ឋាន Google Earth Engine:
      - មេរៀនទី១៖ ការគណនាលើពពក និង Google Earth Engine: lessons/lesson-01.md
      - មេរៀនទី២៖ JavaScript សម្រាប់ Earth Engine: lessons/lesson-02.md
      - មេរៀនទី៣៖ Image Collection ការត្រង ការលុបពពក និង Composite: lessons/lesson-03.md
  - ស្លាយបង្រៀន: slides/index.md
  - សៀវភៅអនុវត្ត (លំហាត់ Earth Engine):
      - លំហាត់ទី១៖ ចាប់ផ្ដើមជាមួយ Code Editor: workbook/lab-01.md
      - លំហាត់ទី២៖ វត្ថុ មុខងារ និង map(): workbook/lab-02.md
      - លំហាត់ទី៣៖ Composite ឥតពពកនៃកម្ពុជា: workbook/lab-03.md
  - ឧបសម្ព័ន្ធ:
      - ក៖ ចុះឈ្មោះ និងរៀបចំ Earth Engine: appendix/a-gee-setup.md
      - ខ៖ ទិន្នន័យ Earth Engine សម្រាប់កម្ពុជា: appendix/b-datasets.md
      - គ៖ ឯកសារយោង: appendix/c-references.md
  - វាក្យសព្ទបច្ចេកទេស: glossary.md
