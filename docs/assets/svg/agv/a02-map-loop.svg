<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 420" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="420" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#2e7d32" text-anchor="start" font-weight="bold" class="ftitle">map() ជំនួស for loop</text><rect x="40.0" y="90.0" width="440.0" height="134.0" rx="8" fill="#263238" stroke="none" stroke-width="1" /><text x="56.0" y="118.0" font-size="14" fill="#a5d6a7" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">// ✗ មិនដំណើរការលើម៉ាស៊ីនមេ</text><text x="56.0" y="140.0" font-size="14" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">for (var i = 0; i &lt; col.size(); i++) {</text><text x="56.0" y="162.0" font-size="14" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">  var img = col.get(i);</text><text x="56.0" y="184.0" font-size="14" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">  ...</text><text x="56.0" y="206.0" font-size="14" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">}</text><rect x="520.0" y="90.0" width="440.0" height="134.0" rx="8" fill="#263238" stroke="none" stroke-width="1" /><text x="536.0" y="118.0" font-size="14" fill="#a5d6a7" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">// ✓ map() ស្របគ្នា</text><text x="536.0" y="140.0" font-size="14" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">var withNdvi = col.map(function(img) {</text><text x="536.0" y="162.0" font-size="14" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">  var nd = img.normalizedDifference([&#x27;B8&#x27;,&#x27;B4&#x27;]);</text><text x="536.0" y="184.0" font-size="14" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">  return img.addBands(nd.rename(&#x27;NDVI&#x27;));</text><text x="536.0" y="206.0" font-size="14" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">});</text><text x="260.0" y="260.0" font-size="14" fill="#c62828" text-anchor="middle" font-weight="normal" >col.size() ជា ee.Number មិនមែនលេខ JS</text><text x="740.0" y="260.0" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="normal" >មុខងារត្រូវ return រូបភាព</text></svg>