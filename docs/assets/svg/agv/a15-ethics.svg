<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 460" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="460" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#2e7d32" text-anchor="start" font-weight="bold" class="ftitle">ក្រមសីលធម៌ទិន្នន័យភូមិសាស្ត្រ</text><text x="24.0" y="64.0" font-size="15" fill="#607d8b" text-anchor="start" font-weight="normal" class="fsub">ប្រាំគោលការណ៍</text><rect x="25.0" y="110.0" width="175.0" height="170.0" rx="12" fill="#1565c0" stroke="none" stroke-width="1" /><text x="112.5" y="191.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold" >ឯកជនភាព</text><text x="112.5" y="215.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >ផ្ទះ · មនុស្ស</text><rect x="217.0" y="110.0" width="175.0" height="170.0" rx="12" fill="#2e7d32" stroke="none" stroke-width="1" /><text x="304.5" y="191.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold" >គ្មានគ្រោះថ្នាក់</text><text x="304.5" y="215.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >ទីតាំងរសើប</text><rect x="409.0" y="110.0" width="175.0" height="170.0" rx="12" fill="#ef6c00" stroke="none" stroke-width="1" /><text x="496.5" y="191.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold" >យុត្តិធម៌</text><text x="496.5" y="215.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >អ្នកដែលខកក្នុងទិន្នន័យ</text><rect x="601.0" y="110.0" width="175.0" height="170.0" rx="12" fill="#6a1b9a" stroke="none" stroke-width="1" /><text x="688.5" y="191.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold" >តម្លាភាព</text><text x="688.5" y="215.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >វិធី · ដែនកំណត់</text><rect x="793.0" y="110.0" width="175.0" height="170.0" rx="12" fill="#c62828" stroke="none" stroke-width="1" /><text x="880.5" y="191.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold" >ការគោរព</text><text x="880.5" y="215.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >អាជ្ញាបណ្ណ · ការយល់ព្រម</text><text x="500.0" y="350.0" font-size="17" fill="#263238" text-anchor="middle" font-weight="bold" >សំណួរមុនចែករំលែក៖ «ផែនទីនេះអាចធ្វើឲ្យនរណាម្នាក់រងគ្រោះបានទេ?»</text></svg>