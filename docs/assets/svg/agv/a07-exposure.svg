y="300.0" width="56.5" height="35.0" rx="0" fill="#d7ccc8" stroke="none" stroke-width="1" /><text x="262.5" y="322.5" font-size="13" fill="#263238" text-anchor="start" font-weight="normal" >០,៩ គម²</text><rect x="640.0" y="100.0" width="330.0" height="200.0" rx="8" fill="#263238" stroke="none" stroke-width="1" /><text x="656.0" y="128.0" font-size="13" fill="#a5d6a7" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">// flooded area by land cover</text><text x="656.0" y="150.0" font-size="13" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">var a = ee.Image.pixelArea()</text><text x="656.0" y="172.0" font-size="13" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">  .divide(1e6).updateMask(flood)</text><text x="656.0" y="194.0" font-size="13" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">  .addBands(worldcover)</text><text x="656.0" y="216.0" font-size="13" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">  .reduceRegion({reducer:</text><text x="656.0" y="238.0" font-size="13" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">   ee.Reducer.sum().group(1),</text><text x="656.0" y="260.0" font-size="13" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">   geometry: aoi, scale: 10,</text><text x="656.0" y="282.0" font-size="13" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">   maxPixels: 1e10});</text></svg>