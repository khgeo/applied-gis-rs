<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 420" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="420" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#2e7d32" text-anchor="start" font-weight="bold" class="ftitle">ការទំនាក់ទំនងភាពមិនប្រាកដ</text><rect x="30.0" y="110.0" width="215.0" height="150.0" rx="12" fill="#1565c0" stroke="none" stroke-width="1" /><text x="137.5" y="181.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold" >លេខ ± ចន្លោះ</text><text x="137.5" y="205.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >ផ្ទៃទឹកជំនន់ ៣២០ ± ៤០ គម²</text><rect x="270.0" y="110.0" width="215.0" height="150.0" rx="12" fill="#43a047" stroke="none" stroke-width="1" /><text x="377.5" y="181.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold" >ភាពត្រឹមត្រូវ</text><text x="377.5" y="205.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >OA ៨៥% · PA ស្រែ ៧៨%</text><rect x="510.0" y="110.0" width="215.0" height="150.0" rx="12" fill="#ef6c00" stroke="none" stroke-width="1" /><text x="617.5" y="181.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold" >សេណារីយ៉ូ</text><text x="617.5" y="205.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >កម្រិត ១០% ធៀប ៣០%</text><rect x="750.0" y="110.0" width="215.0" height="150.0" rx="12" fill="#c62828" stroke="none" stroke-width="1" /><text x="857.5" y="181.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold" >ដែនកំណត់</text><text x="857.5" y="205.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >«អ្វីដែលយើងមិនអាចសន្និដ្ឋាន»</text><text x="500.0" y="320.0" font-size="17" fill="#263238" text-anchor="middle" font-weight="bold" >ផែនទីដែលមើលទៅ «ប្រាកដ» ពេក អាចនាំឲ្យសម្រេចចិត្តខុស</text></svg>