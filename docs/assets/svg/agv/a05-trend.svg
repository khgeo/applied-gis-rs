="330.0" height="222.0" rx="8" fill="#263238" stroke="none" stroke-width="1" /><text x="656.0" y="128.0" font-size="13" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">var withT = col.map(function(img){</text><text x="656.0" y="150.0" font-size="13" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">  var t = img.date().difference(</text><text x="656.0" y="172.0" font-size="13" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">     &#x27;2016-01-01&#x27;, &#x27;year&#x27;);</text><text x="656.0" y="194.0" font-size="13" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">  return img.select(&#x27;NDVI&#x27;)</text><text x="656.0" y="216.0" font-size="13" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">     .addBands(ee.Image(t)</text><text x="656.0" y="238.0" font-size="13" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">     .rename(&#x27;t&#x27;).float());});</text><text x="656.0" y="260.0" font-size="13" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">var fit = withT.select([&#x27;t&#x27;,&#x27;NDVI&#x27;])</text><text x="656.0" y="282.0" font-size="13" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">  .reduce(ee.Reducer.linearFit());</text><text x="656.0" y="304.0" font-size="13" fill="#a5d6a7" text-anchor="start" font-weight="normal" font-family="monospace" xml:space="preserve">// bands: scale (slope), offset</text><text x="640.0" y="360.0" font-size="16" fill="#c62828" text-anchor="start" font-weight="bold" >ជម្រាល = -០,០១៩ NDVI/ឆ្នាំ</text></svg>