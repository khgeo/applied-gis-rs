<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 380" font-family="Battambang, Siemreap, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1000" height="380" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#2e7d32" text-anchor="start" font-weight="bold" class="ftitle">គំរូ filter → map → reduce</text><rect x="60.0" y="130.0" width="260.0" height="120.0" rx="12" fill="#43a047" stroke="none" stroke-width="1" /><text x="190.0" y="186.0" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >filter</text><text x="190.0" y="210.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >ជ្រើសតែអ្វីដែលត្រូវការ</text><line x1="322.0" y1="190.0" x2="366.0" y2="190.0" stroke="#607d8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="370.0" y="130.0" width="260.0" height="120.0" rx="12" fill="#ef6c00" stroke="none" stroke-width="1" /><text x="500.0" y="186.0" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >map</text><text x="500.0" y="210.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >គណនាលើធាតុនីមួយៗ</text><line x1="632.0" y1="190.0" x2="676.0" y2="190.0" stroke="#607d8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="680.0" y="130.0" width="260.0" height="120.0" rx="12" fill="#6d4c41" stroke="none" stroke-width="1" /><text x="810.0" y="186.0" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >reduce</text><text x="810.0" y="210.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >សង្ខេបជាលទ្ធផលមួយ</text><text x="500.0" y="320.0" font-size="16" fill="#263238" text-anchor="middle" font-weight="normal" >ស្គ្រីប Earth Engine ភាគច្រើនជាបន្សំនៃជំហានទាំងបី</text></svg>