<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 440" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="440" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#2e7d32" text-anchor="start" font-weight="bold" class="ftitle">ការលុបពពកដោយ SCL (Sentinel-2) និង QA_PIXEL (Landsat)</text><rect x="40.0" y="90.0" width="34.0" height="32.0" rx="0" fill="#424242" stroke="#9e9e9e" stroke-width="1" /><text x="90.0" y="112.0" font-size="14" fill="#263238" text-anchor="start" font-weight="bold" >SCL = ៣</text><text x="190.0" y="112.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >ស្រមោលពពក</text><text x="420.0" y="112.0" font-size="14" fill="#c62828" text-anchor="start" font-weight="bold" >✗ mask</text><rect x="40.0" y="132.0" width="34.0" height="32.0" rx="0" fill="#43a047" stroke="#9e9e9e" stroke-width="1" /><text x="90.0" y="154.0" font-size="14" fill="#263238" text-anchor="start" font-weight="bold" >SCL = ៤</text><text x="190.0" y="154.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >រុក្ខជាតិ</text><text x="420.0" y="154.0" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="bold" >✓ ទុក</text><rect x="40.0" y="174.0" width="34.0" height="32.0" rx="0" fill="#bcaaa4" stroke="#9e9e9e" stroke-width="1" /><text x="90.0" y="196.0" font-size="14" fill="#263238" text-anchor="start" font-weight="bold" >SCL = ៥</text><text x="190.0" y="196.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >ដីទទេ</text><text x="420.0" y="196.0" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="bold" >✓ ទុក</text><rect x="40.0" y="216.0" width="34.0" height="32.0" rx="0" fill="#1e88e5" stroke="#9e9e9e" stroke-width="1" /><text x="90.0" y="238.0" font-size="14" fill="#263238" text-anchor="start" font-weight="bold" >SCL = ៦</text><text x="190.0" y="238.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >ទឹក</text><text x="420.0" y="238.0" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="bold" >✓ ទុក</text><rect x="40.0" y="258.0" width="34.0" height="32.0" rx="0" fill="#bdbdbd" stroke="#9e9e9e" stroke-width="1" /><text x="90.0" y="280.0" font-size="14" fill="#263238" text-anchor="start" font-weight="bold" >SCL = ៨</text><text x="190.0" y="280.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >ពពកប្រូបាប៊ីលីតេមធ្យម</text><text x="420.0" y="280.0" font-size="14" fill="#c62828" text-anchor="start" font-weight="bold" >✗ mask</text><rect x="40.0" y="300.0" width="34.0" height="32.0" rx="0" fill="#eeeeee" stroke="#9e9e9e" stroke-width="1" /><text x="90.0" y="322.0" font-size="14" fill="#263238" text-anchor="start" font-weight="bold" >SCL = ៩</text><text x="190.0" y="322.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >ពពកប្រូបាប៊ីលីតេខ្ពស់</text><text x="420.0" y="322.0" font-size="14" fill="#c62828" text-anchor="start" font-weight="bold" >✗ mask</text><rect x="40.0" y="342.0" width="34.0" height="32.0" rx="0" fill="#e1f5fe" stroke="#9e9e9e" stroke-width="1" /><text x="90.0" y="364.0" font-size="14" fill="#263238" text-anchor="start" font-weight="bold" >SCL = ១០</text><text x="190.0" y="364.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >Cirrus</text><text x="420.0" y="364.0" font-size="14" fill="#c62828" text-anchor="start" font-weight="bold" >✗ mask</text><text x="560.0" y="100.0" font-size="16" fill="#2e7d32" text-anchor="start" font-weight="bold" >Landsat QA_PIXEL (ប៊ីត)</text><rect x="560.0" y="120.0" width="92.0" height="48.0" rx="6" fill="#e8f5e9" stroke="#9e9e9e" stroke-width="1" /><text x="606.0" y="150.0" font-size="13" fill="#263238" text-anchor="middle" font-weight="normal" >0 Fill</text><rect x="660.0" y="120.0" width="92.0" height="48.0" rx="6" fill="#ffcdd2" stroke="#9e9e9e" stroke-width="1" /><text x="706.0" y="150.0" font-size="13" fill="#263238" text-anchor="middle" font-weight="normal" >1 Dilated</text><rect x="760.0" y="120.0" width="92.0" height="48.0" rx="6" fill="#ffcdd2" stroke="#9e9e9e" stroke-width="1" /><text x="806.0" y="150.0" font-size="13" fill="#263238" text-anchor="middle" font-weight="normal" >2 Cirrus</text><rect x="860.0" y="120.0" width="92.0" height="48.0" rx="6" fill="#ffcdd2" stroke="#9e9e9e" stroke-width="1" /><text x="906.0" y="150.0" font-size="13" fill="#263238" text-anchor="middle" font-weight="normal" >3 Cloud</text><rect x="560.0" y="180.0" width="92.0" height="48.0" rx="6" fill="#ffcdd2" stroke="#9e9e9e" stroke-width="1" /><text x="606.0" y="210.0" font-size="13" fill="#263238" text-anchor="middle" font-weight="normal" >4 Shadow</text><rect x="660.0" y="180.0" width="92.0" height="48.0" rx="6" fill="#e8f5e9" stroke="#9e9e9e" stroke-width="1" /><text x="706.0" y="210.0" font-size="13" fill="#263238" text-anchor="middle" font-weight="normal" >5 Snow</text><rect x="760.0" y="180.0" width="92.0" height="48.0" rx="6" fill="#e8f5e9" stroke="#9e9e9e" stroke-width="1" /><text x="806.0" y="210.0" font-size="13" fill="#263238" text-anchor="middle" font-weight="normal" >6 Clear</text><rect x="860.0" y="180.0" width="92.0" height="48.0" rx="6" fill="#e8f5e9" stroke="#9e9e9e" stroke-width="1" /><text x="906.0" y="210.0" font-size="13" fill="#263238" text-anchor="middle" font-weight="normal" >7 Water</text><text x="560.0" y="290.0" font-size="14" fill="#c62828" text-anchor="start" font-weight="normal" >mask = bit 3 (cloud) ឬ bit 4 (shadow) = 1</text></svg>