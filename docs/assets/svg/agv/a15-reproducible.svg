<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 440" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="440" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#2e7d32" text-anchor="start" font-weight="bold" class="ftitle">បញ្ជីពិនិត្យភាពអាចធ្វើឡើងវិញ (reproducibility)</text><rect x="60.0" y="100.0" width="30.0" height="30.0" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="2" /><text x="75.0" y="122.0" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="bold" >✓</text><text x="110.0" y="122.0" font-size="15" fill="#263238" text-anchor="start" font-weight="normal" >ស្គ្រីបមួយ ឬច្រើន ដែលរត់ពីដើមដល់ចប់ ដោយគ្មានការកែដោយដៃ</text><rect x="60.0" y="145.0" width="30.0" height="30.0" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="2" /><text x="75.0" y="167.0" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="bold" >✓</text><text x="110.0" y="167.0" font-size="15" fill="#263238" text-anchor="start" font-weight="normal" >ID និងកំណែទិន្នន័យ (ឧ. Hansen v1.11) · កាលបរិច្ឆេទ · scale · CRS</text><rect x="60.0" y="190.0" width="30.0" height="30.0" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="2" /><text x="75.0" y="212.0" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="bold" >✓</text><text x="110.0" y="212.0" font-size="15" fill="#263238" text-anchor="start" font-weight="normal" >seed សម្រាប់ randomColumn និង classifier</text><rect x="60.0" y="235.0" width="30.0" height="30.0" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="2" /><text x="75.0" y="257.0" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="bold" >✓</text><text x="110.0" y="257.0" font-size="15" fill="#263238" text-anchor="start" font-weight="normal" >Asset ដែលប្រើ ចែករំលែក «Anyone can read»</text><rect x="60.0" y="280.0" width="30.0" height="30.0" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="2" /><text x="75.0" y="302.0" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="bold" >✓</text><text x="110.0" y="302.0" font-size="15" fill="#263238" text-anchor="start" font-weight="normal" >កម្រិត និងទម្ងន់ទាំងអស់ ជាអថេរនៅដើមស្គ្រីប</text><rect x="60.0" y="325.0" width="30.0" height="30.0" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="2" /><text x="75.0" y="347.0" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="bold" >✓</text><text x="110.0" y="347.0" font-size="15" fill="#263238" text-anchor="start" font-weight="normal" >README៖ របៀបរត់ · លទ្ធផល · ដែនកំណត់</text><rect x="60.0" y="370.0" width="30.0" height="30.0" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="2" /><text x="75.0" y="392.0" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="bold" >✓</text><text x="110.0" y="392.0" font-size="15" fill="#263238" text-anchor="start" font-weight="normal" >រក្សាទុកក្នុង Git (GitHub) ជាមួយកំណែ</text></svg>