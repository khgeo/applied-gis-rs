<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 420" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="420" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#2e7d32" text-anchor="start" font-weight="bold" class="ftitle">getInfo() ឬ evaluate()?</text><rect x="60.0" y="110.0" width="330.0" height="120.0" rx="12" fill="#c62828" stroke="none" stroke-width="1" /><text x="225.0" y="166.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold" >getInfo()</text><text x="225.0" y="190.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >កម្មវិធីរុករក «ជាប់គាំង» រហូតដល់ម៉ាស៊ីនមេឆ្លើយ</text><rect x="610.0" y="110.0" width="330.0" height="120.0" rx="12" fill="#2e7d32" stroke="none" stroke-width="1" /><text x="775.0" y="166.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold" >evaluate(callback)</text><text x="775.0" y="190.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >កម្មវិធីនៅតែដំណើរការ · callback រត់ពេលមានចម្លើយ</text><text x="225.0" y="280.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="normal" font-family="monospace">var n = col.size().getInfo();</text><text x="775.0" y="280.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="normal" font-family="monospace">col.size().evaluate(function(n) {</text><text x="775.0" y="305.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="normal" font-family="monospace">  label.setValue(&#x27;images: &#x27; + n); });</text><text x="500.0" y="370.0" font-size="15" fill="#607d8b" text-anchor="middle" font-weight="normal" >ក្នុងកម្មវិធី៖ ប្រើ evaluate() ជានិច្ច · រក្សាវត្ថុ ee.* នៅលើម៉ាស៊ីនមេឲ្យបានយូរបំផុត</text></svg>