ff" text-anchor="middle" font-weight="normal" >ស្រទាប់វ៉ិចទ័រ</text><rect x="670.0" y="210.0" width="290.0" height="100.0" rx="12" fill="#6d4c41" stroke="none" stroke-width="1" /><text x="815.0" y="256.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold" >ee.Reducer</text><text x="815.0" y="280.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >ស្ថិតិ</text><rect x="40.0" y="340.0" width="920.0" height="70.0" rx="12" fill="#546e7a" stroke="none" stroke-width="1" /><text x="500.0" y="371.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" >ee.Number · ee.String · ee.List · ee.Date · ee.Dictionary</text><text x="500.0" y="395.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal" >ទិន្នន័យសាមញ្ញលើម៉ាស៊ីនមេ</text></svg>