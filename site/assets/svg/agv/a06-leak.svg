<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 450" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="450" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#2e7d32" text-anchor="start" font-weight="bold" class="ftitle">ចំណុចផ្ទៀងផ្ទាត់ជិតពេក បំប៉ោងភាពត្រឹមត្រូវ</text><text x="24.0" y="64.0" font-size="15" fill="#607d8b" text-anchor="start" font-weight="normal" class="fsub">ពហុកោណបណ្ដុះបណ្ដាល ៦០ (៧ × ៧ ក្រឡា) · Random Forest ៥០ ដើម · Landsat 8 OLI · ភ្នំពេញ · ១១ កុម្ភៈ ២០១៩ · USGS</text><text x="330.0" y="131.8" font-size="14" fill="#263238" text-anchor="end" font-weight="normal" >បំបែកតាមក្រឡា (ពហុកោណដដែល)</text><rect x="340.0" y="100.0" width="535.9" height="53.7" rx="0" fill="#e57373" stroke="none" stroke-width="1" /><text x="881.9" y="131.8" font-size="13" fill="#263238" text-anchor="start" font-weight="normal" >៩២%</text><text x="330.0" y="208.5" font-size="14" fill="#263238" text-anchor="end" font-weight="normal" >បំបែកតាមពហុកោណ</text><rect x="340.0" y="176.7" width="490.6" height="53.7" rx="0" fill="#43a047" stroke="none" stroke-width="1" /><text x="836.6" y="208.5" font-size="13" fill="#263238" text-anchor="start" font-weight="normal" >៨៥%</text><text x="330.0" y="285.2" font-size="14" fill="#263238" text-anchor="end" font-weight="normal" >ភាពត្រឹមត្រូវពិត (៩០ ០០០ ក្រឡា)</text><rect x="340.0" y="253.3" width="480.5" height="53.7" rx="0" fill="#1e88e5" stroke="none" stroke-width="1" /><text x="826.5" y="285.2" font-size="13" fill="#263238" text-anchor="start" font-weight="normal" >៨៣%</text><text x="500.0" y="385.0" font-size="15" fill="#c62828" text-anchor="middle" font-weight="normal" >ក្រឡាក្នុងពហុកោណតែមួយ ស្រដៀងគ្នាខ្លាំង (spatial autocorrelation)៖ វាមិនមែនការសាកល្បងឯករាជ្យទេ</text></svg>