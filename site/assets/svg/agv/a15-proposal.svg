<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 470" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="470" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#2e7d32" text-anchor="start" font-weight="bold" class="ftitle">ពុម្ពសំណើគម្រោង (១ ទំព័រ)</text><rect x="60.0" y="88.0" width="880.0" height="40.0" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1" /><text x="80.0" y="114.0" font-size="15" fill="#2e7d32" text-anchor="start" font-weight="bold" >១. ចំណងជើង</text><text x="380.0" y="114.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >ខ្លី ច្បាស់ មានទីកន្លែង និងពេលវេលា</text><rect x="60.0" y="134.0" width="880.0" height="40.0" rx="0" fill="#fff" stroke="none" stroke-width="1" /><text x="80.0" y="160.0" font-size="15" fill="#2e7d32" text-anchor="start" font-weight="bold" >២. បញ្ហា និងអ្នកប្រើ</text><text x="380.0" y="160.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >ហេតុអ្វីសំខាន់ · អ្នកណានឹងប្រើ</text><rect x="60.0" y="180.0" width="880.0" height="40.0" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1" /><text x="80.0" y="206.0" font-size="15" fill="#2e7d32" text-anchor="start" font-weight="bold" >៣. សំណួរស្រាវជ្រាវ</text><text x="380.0" y="206.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >១–២ សំណួរ ដែលអាចឆ្លើយបាន</text><rect x="60.0" y="226.0" width="880.0" height="40.0" rx="0" fill="#fff" stroke="none" stroke-width="1" /><text x="80.0" y="252.0" font-size="15" fill="#2e7d32" text-anchor="start" font-weight="bold" >៤. តំបន់ និងរយៈពេល</text><text x="380.0" y="252.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >AOI · ឆ្នាំ · រដូវ</text><rect x="60.0" y="272.0" width="880.0" height="40.0" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1" /><text x="80.0" y="298.0" font-size="15" fill="#2e7d32" text-anchor="start" font-weight="bold" >៥. ទិន្នន័យ</text><text x="380.0" y="298.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >ID Earth Engine · ក្រឡា · អាជ្ញាបណ្ណ</text><rect x="60.0" y="318.0" width="880.0" height="40.0" rx="0" fill="#fff" stroke="none" stroke-width="1" /><text x="80.0" y="344.0" font-size="15" fill="#2e7d32" text-anchor="start" font-weight="bold" >៦. វិធីសាស្ត្រ</text><text x="380.0" y="344.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >ជំហាន ៥–៨ · មេរៀនដែលពាក់ព័ន្ធ</text><rect x="60.0" y="364.0" width="880.0" height="40.0" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1" /><text x="80.0" y="390.0" font-size="15" fill="#2e7d32" text-anchor="start" font-weight="bold" >៧. ការផ្ទៀងផ្ទាត់</text><text x="380.0" y="390.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >ចំណុច · ស្ថិតិ · ការពិនិត្យដោយភ្នែក</text><rect x="60.0" y="410.0" width="880.0" height="40.0" rx="0" fill="#fff" stroke="none" stroke-width="1" /><text x="80.0" y="436.0" font-size="15" fill="#2e7d32" text-anchor="start" font-weight="bold" >៨. លទ្ធផល និងកាលវិភាគ</text><text x="380.0" y="436.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >ផែនទី · តារាង · កម្មវិធី · ប្រចាំសប្ដាហ៍</text></svg>