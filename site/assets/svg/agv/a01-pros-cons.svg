<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 440" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="440" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#2e7d32" text-anchor="start" font-weight="bold" class="ftitle">ចំណុចខ្លាំង និងដែនកំណត់នៃ Earth Engine</text><rect x="40.0" y="90.0" width="440.0" height="320.0" rx="12" fill="#e8f5e9" stroke="#81c784" stroke-width="2" /><text x="260.0" y="125.0" font-size="20" fill="#2e7d32" text-anchor="middle" font-weight="bold" >✓ ចំណុចខ្លាំង</text><text x="70.0" y="170.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• ទិន្នន័យរៀបចំរួច</text><text x="70.0" y="214.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• គណនាលឿនលើតំបន់ធំ</text><text x="70.0" y="258.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• ឥតគិតថ្លៃសម្រាប់ការសិក្សា</text><text x="70.0" y="302.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• កូដចែករំលែកបានតាមតំណ</text><text x="70.0" y="346.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• កម្មវិធីវេបងាយ</text><rect x="520.0" y="90.0" width="440.0" height="320.0" rx="12" fill="#fff3e0" stroke="#ffb74d" stroke-width="2" /><text x="740.0" y="125.0" font-size="20" fill="#e65100" text-anchor="middle" font-weight="bold" >! ដែនកំណត់</text><text x="550.0" y="170.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• ត្រូវការអ៊ីនធឺណិត</text><text x="550.0" y="214.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• កំណត់ពេល និងអង្គចងចាំ</text><text x="550.0" y="258.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• ក្បួនដោះស្រាយមានកំណត់</text><text x="550.0" y="302.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• ពឹងលើក្រុមហ៊ុនមួយ</text><text x="550.0" y="346.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >• លក្ខខណ្ឌប្រើពាណិជ្ជកម្ម</text></svg>