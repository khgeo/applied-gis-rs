<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 400" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="400" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#2e7d32" text-anchor="start" font-weight="bold" class="ftitle">ឧបសគ្គ (constraints)</text><text x="24.0" y="64.0" font-size="15" fill="#607d8b" text-anchor="start" font-weight="normal" class="fsub">ក្រឡាដែលមិនអាចប្រើ ទោះបីពិន្ទុខ្ពស់ក៏ដោយ · ស្រទាប់ក្លែងធ្វើលើ DEM គំរូ (សម្រាប់បង្រៀន)</text><image xlink:href="data:image/png;base64," x="30.0" y="90.0" width="210.0" height="210.0" preserveAspectRatio="none" /><text x="135.0" y="325.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >ព្រៃ / ជម្រាលខ្លាំង</text><image xlink:href="data:image/png;base64," x="270.0" y="90.0" width="210.0" height="210.0" preserveAspectRatio="none" /><text x="375.0" y="325.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >ទឹក / ទន្លេ</text><image xlink:href="data:image/png;base64," x="510.0" y="90.0" width="210.0" height="210.0" preserveAspectRatio="none" /><text x="615.0" y="325.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >ភូមិ + ១២០ ម</text><image xlink:href="data:image/png;base64," x="750.0" y="90.0" width="210.0" height="210.0" preserveAspectRatio="none" /><text x="855.0" y="325.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >រួម</text><text x="500.0" y="370.0" font-size="15" fill="#607d8b" text-anchor="middle" font-weight="normal" >ផ្ទៃដែលនៅសល់៖ ៥២% នៃតំបន់</text></svg>