name: Build PDF book

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Khmer fonts (Google Fonts, SIL OFL)
        run: |
          mkdir -p ~/.fonts
          for f in battambang/Battambang-Regular.ttf battambang/Battambang-Bold.ttf moul/Moul-Regular.ttf siemreap/Siemreap.ttf; do
            curl -sfL -o ~/.fonts/$(basename $f) https://raw.githubusercontent.com/google/fonts/main/ofl/$f
          done
          fc-cache -f
      - run: pip install -r requirements.txt -r tools/pdf/requirements.txt
      - run: playwright install --with-deps chromium
      - run: mkdocs build
      - run: python tools/pdf/build_book.py
      - uses: actions/upload-artifact@v4
        with:
          name: applied-gis-rs-pdf
          path: |
            book/applied-gis-rs.pdf
            book/cover-wrap-print.pdf
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # published release → that release; manual run → the latest release (if any)
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true); fi
          if [ -n "$TAG" ]; then gh release upload "$TAG" book/applied-gis-rs.pdf book/cover-wrap-print.pdf --clobber; else echo "No release to attach to"; fi
